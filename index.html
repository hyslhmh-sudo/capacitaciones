<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D313F">
<title>Capacitaciones HyS · HZT / HMH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#F4F7F8; font-family:'Plus Jakarta Sans', Arial, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  iframe { flex:1; width:100%; border:0; display:block; }
  .aviso { max-width:560px; margin:40px auto; padding:24px; background:#fff; border-radius:10px; color:#0D313F; }
  .aviso h1 { font-size:21px; margin:0 0 8px; }
  .aviso p { color:#5b6b73; margin:0; font-size:16px; line-height:1.5; }
</style>
</head>
<body>
<script>
  // Dirección de la Web App del sistema de capacitaciones (libro único «CAPACITACIONES · Sistema HyS», desde el 15/10/2026).
  // Los links y QR que ya circulan siguen sirviendo: el código (k) de cada capacitación es el mismo en los dos sistemas.
  // Sistema anterior (solo como respaldo): https://script.google.com/macros/s/AKfycbwKduTFNC4b6s5OLYcPNCjI1GbgQD2ymFN5yqBK7D1fh1pPRMzS_kpB4khnKqEhu4qYEA/exec
  var APP = 'https://script.google.com/macros/s/AKfycbxXz2AuN9nx5JkiNVI0LFYpEG-0ciYTXH9pN6QnO3SIaIltljCi8sbRB4PwiDx9Jf4Ugw/exec';
  var q = new URLSearchParams(location.search), par = '';
  ['k', 'd', 'i', 'c'].forEach(function (n) { var v = q.get(n); if (!par && v && /^[A-Za-z0-9_-]{4,40}$/.test(v)) par = n + '=' + encodeURIComponent(v); });
  if (par) {
    var f = document.createElement('iframe');
    f.src = APP + '?' + par;
    f.title = 'Capacitaciones HyS';
    f.setAttribute('allow', 'clipboard-write');
    document.body.appendChild(f);
  } else {
    document.body.insertAdjacentHTML('beforeend',
      '<div class="aviso"><h1>Usá el link de tu capacitación</h1>' +
      '<p>Para registrarte necesitás el link o el QR que comparte quien dicta la capacitación.</p></div>');
  }
</script>
</body>
</html>
