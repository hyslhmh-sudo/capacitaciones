<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D313F">
<title>Mis certificados · Capacitaciones HyS · HZT / HMH</title>
<meta name="description" content="Consultá y descargá tus certificados y constancias de capacitación de Higiene y Seguridad con tu DNI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#F4F7F8; font-family:'Plus Jakarta Sans', Arial, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  iframe { flex:1; width:100%; border:0; display:block; }
</style>
</head>
<body>
<script>
  // «Mis certificados» y verificación de certificados (libro CAPACITACIONES · Sistema HyS, fase 6).
  // ?v=CÓDIGO abre la verificación de ese certificado (es el link del QR de cada certificado); sin nada, «Mis certificados».
  var APP = 'https://script.google.com/macros/s/AKfycbxXz2AuN9nx5JkiNVI0LFYpEG-0ciYTXH9pN6QnO3SIaIltljCi8sbRB4PwiDx9Jf4Ugw/exec';
  var v = new URLSearchParams(location.search).get('v');
  var f = document.createElement('iframe');
  f.src = APP + (v && /^[A-Za-z0-9-]{4,40}$/.test(v) ? '?v=' + encodeURIComponent(v) : '?m=1');
  f.title = 'Certificados de capacitación HyS';
  f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);
</script>
</body>
</html>
