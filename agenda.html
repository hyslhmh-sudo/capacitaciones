<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D313F">
<meta name="robots" content="noindex, nofollow">
<title>Agenda de capacitaciones · HyS HZT / HMH</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#F6F9FA; font-family:'Plus Jakarta Sans', Arial, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  iframe { flex:1; width:100%; border:0; display:block; }
</style>
</head>
<body>
<script>
  // Dirección de la Web App del sistema de capacitaciones (Apps Script). No cambia al publicar versiones nuevas.
  var APP = 'https://script.google.com/macros/s/AKfycbwKduTFNC4b6s5OLYcPNCjI1GbgQD2ymFN5yqBK7D1fh1pPRMzS_kpB4khnKqEhu4qYEA/exec';
  var q = new URLSearchParams(location.search), src = APP + '?ag=1';
  var limpio = function (v) { return /^[A-Za-z0-9]{6,40}$/.test(v || '') ? v : ''; };
  if (limpio(q.get('j'))) src += '&j=' + q.get('j');           // página de una jefatura
  else if (limpio(q.get('x'))) src += '&x=' + q.get('x');      // cancelar una inscripción
  else if (q.get('yo')) src += '&yo=1';                        // inscripción personal con DNI
  var f = document.createElement('iframe');
  f.src = src; f.title = 'Agenda de capacitaciones'; f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);
</script>
</body>
</html>
