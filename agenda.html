<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D313F">
<title>Agenda de capacitaciones · Higiene y Seguridad · HZT / HMH</title>
<meta name="description" content="Anotate con tu DNI a las clases abiertas de Higiene y Seguridad, o reservá un horario de capacitación para tu servicio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#F4F7F8; font-family:'Plus Jakarta Sans', Arial, sans-serif; }
  body { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  iframe { flex:1; width:100%; border:0; display:block; }
</style>
</head>
<body>
<script>
  // Agenda de capacitaciones (libro CAPACITACIONES · Sistema HyS, fase 7).
  // ?t=ID_TURNO abre directamente esa clase abierta (link del portal público y de los carteles).
  // ?c=TOKEN abre la cancelación (link de los correos de confirmación y recordatorio).
  var APP = 'https://script.google.com/macros/s/AKfycbxXz2AuN9nx5JkiNVI0LFYpEG-0ciYTXH9pN6QnO3SIaIltljCi8sbRB4PwiDx9Jf4Ugw/exec';
  var q = new URLSearchParams(location.search), c = q.get('c'), t = q.get('t');
  var src = APP + '?a=1';
  if (c && /^[A-Za-z0-9]{10,40}$/.test(c)) src += '&c=' + encodeURIComponent(c);
  else if (t && /^[A-Za-z0-9-]{6,40}$/.test(t)) src += '&t=' + encodeURIComponent(t);
  var f = document.createElement('iframe');
  f.src = src;
  f.title = 'Agenda de capacitaciones HyS';
  document.body.appendChild(f);
</script>
</body>
</html>
